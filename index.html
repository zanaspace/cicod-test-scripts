<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CICOD &amp; 1Government Test Cases</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #070a14;
      --bg-surface: #0c1224;
      --bg-card: #111a33;
      --bg-card-hover: #172447;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent: #10b981;
      --accent-sky: #38bdf8;
      --pass: #10b981;
      --warn: #f59e0b;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
    ::-webkit-scrollbar-thumb { background: #1c2847; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #2a3d6b; }

    /* Header */
    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #10b981 0%, #0284c7 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: #fff;
    }

    .brand-title h1 {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.01em;
    }

    .brand-title p {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .status-badge-live {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 14px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }

    /* Main Container */
    .layout-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Minimal Modular Sidebar */
    aside.sidebar {
      width: 270px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Module Accordion Item */
    .module-group {
      display: flex;
      flex-direction: column;
    }

    .module-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .module-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.16);
    }

    .module-btn.active-parent {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.08);
    }

    .module-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .module-chevron {
      font-size: 0.65rem;
      color: var(--text-muted);
      transition: transform 0.2s ease;
      display: inline-block;
    }

    .module-chevron.expanded {
      transform: rotate(90deg);
    }

    .module-badge {
      font-size: 0.68rem;
      font-family: 'JetBrains Mono', monospace;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .features-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-left: 10px;
      margin-top: 4px;
      border-left: 2px solid rgba(255, 255, 255, 0.07);
      margin-left: 14px;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .features-list.collapsed {
      display: none;
    }

    .feature-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.18s ease;
    }

    .feature-item:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.04);
    }

    .feature-item.active {
      color: #fff;
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.35);
    }

    .pill-rate {
      font-size: 0.66rem;
      font-family: 'JetBrains Mono', monospace;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }

    .pill-rate.gap {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
    }

    /* Main Content Area */
    main.main-view {
      flex: 1;
      overflow-y: auto;
      padding: 20px 26px 40px 26px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Top Row: Module Title */
    .module-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .module-title-h2 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .module-parent-crumb {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dim);
    }

    .status-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    /* Dashboard KPI Cards */
    .dashboard-kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    @media (max-width: 900px) {
      .dashboard-kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .kpi-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }

    .kpi-number {
      font-size: 1.45rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      color: #fff;
    }

    /* Test Photos Section */
    .section-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.86rem;
      font-weight: 700;
      color: #fff;
    }

    .photos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }

    .photo-thumb-card {
      background: #060914;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .photo-thumb-card:hover {
      border-color: var(--accent-sky);
      transform: translateY(-2px);
    }

    .thumb-img-box {
      width: 100%;
      height: 105px;
      overflow: hidden;
      background: #02050f;
    }

    .thumb-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.25s ease;
    }

    .photo-thumb-card:hover .thumb-img-box img {
      transform: scale(1.06);
    }

    .photo-caption {
      padding: 8px 10px;
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.35;
      font-weight: 500;
    }

    /* Embedded HTML Report Frame */
    .report-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 750px;
    }

    .report-bar {
      padding: 10px 16px;
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
    }

    .report-bar-title {
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .open-ext-link {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--accent-sky);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .open-ext-link:hover {
      text-decoration: underline;
    }

    iframe.report-frame {
      width: 100%;
      height: 100%;
      min-height: 750px;
      border: none;
      background: #0b0f19;
    }

    /* Image Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding: 14px;
    }

    .modal-img-wrap {
      max-height: 78vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }

    .modal-img-wrap img {
      max-width: 100%;
      max-height: 78vh;
      object-fit: contain;
    }

    .modal-caption {
      margin-top: 10px;
      font-size: 0.84rem;
      font-weight: 600;
      color: #fff;
      text-align: center;
    }

    .modal-close {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #ef4444;
      color: #fff;
      border: 2px solid #fff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>

    let activeModuleId = appModules[0].id;
    let activeFeatureId = appModules[0].features[0].id;

    function init() {
      renderSidebar();
      renderContent();
    }

    function toggleModule(modId) {
      const mod = appModules.find(m => m.id === modId);
      if (!mod) return;
      mod.expanded = !mod.expanded;
      renderSidebar();
    }

    function selectFeature(modId, featId) {
      activeModuleId = modId;
      activeFeatureId = featId;
      const mod = appModules.find(m => m.id === modId);
      if (mod) mod.expanded = true;
      renderSidebar();
      renderContent();
      document.getElementById('mainView').scrollTop = 0;
    }

    function renderSidebar() {
      const list = document.getElementById('sidebarList');
      list.innerHTML = appModules.map(mod => {
        const isParentActive = mod.id === activeModuleId;
        return `
          <div class="module-group">
            <div class="module-btn ${isParentActive ? 'active-parent' : ''}" onclick="toggleModule('${mod.id}')">
              <div class="module-left">
                <span class="module-chevron ${mod.expanded ? 'expanded' : ''}">▶</span>
                <span>${mod.icon} ${mod.name}</span>
              </div>
              <span class="module-badge">${mod.badge}</span>
            </div>

            <div class="features-list ${mod.expanded ? '' : 'collapsed'}">
              ${mod.features.map(f => {
                const isActive = mod.id === activeModuleId && f.id === activeFeatureId;
                const isUpcoming = !!f.isUpcoming;
                const rateNum = parseFloat(f.passRate);
                const is100 = !isUpcoming && rateNum >= 99;
                return `
                  <div class="feature-item ${isActive ? 'active' : ''}" onclick="selectFeature('${mod.id}', '${f.id}')">
                    <span>${f.sheetName}</span>
                    <span class="pill-rate ${isUpcoming ? '' : (is100 ? '' : 'gap')}" style="${isUpcoming ? 'background:rgba(56,189,248,0.15);color:#38bdf8;' : ''}">${f.passRate}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderContent() {
      const mod = appModules.find(m => m.id === activeModuleId) || appModules[0];
      const sheet = mod.features.find(f => f.id === activeFeatureId) || mod.features[0];
      const main = document.getElementById('mainView');
      const isUpcoming = !!sheet.isUpcoming;

      main.innerHTML = `
        <!-- Top Bar with Module Context & Sheet Name -->
        <div class="module-top-bar">
          <h2 class="module-title-h2">
            <span class="module-parent-crumb">${mod.name} /</span>
            <span>${sheet.sheetName}</span>
          </h2>
          <span class="status-tag" style="${isUpcoming ? 'background:rgba(56,189,248,0.15);color:#38bdf8;border-color:rgba(56,189,248,0.3);' : ''}">${sheet.status}</span>
        </div>

        <!-- Dashboard KPI Cards (Intact) -->
        <div class="dashboard-kpi-grid">
          <div class="kpi-card">
            <span class="kpi-title">${isUpcoming ? 'Status' : 'Pass Rate'}</span>
            <span class="kpi-number" style="color:${isUpcoming ? '#38bdf8' : '#34d399'};font-size:1.35rem;">${sheet.passRate}</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-title">${isUpcoming ? 'Target Steps' : 'Verified Steps'}</span>
            <span class="kpi-number" style="color:#38bdf8;">${isUpcoming ? sheet.totalSteps + ' Steps' : sheet.passCount + ' / ' + sheet.totalSteps}</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-title">${isUpcoming ? 'Target Route' : 'Documented Gaps'}</span>
            <span class="kpi-number" style="color:${isUpcoming ? '#a855f7' : (sheet.gapCount > 0 ? '#fbbf24' : '#94a3b8')};font-size:${isUpcoming ? '1.05rem' : '1.45rem'};">${isUpcoming ? sheet.targetRoute : sheet.gapCount}</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-title">${isUpcoming ? 'Architecture' : 'Test Photos'}</span>
            <span class="kpi-number" style="color:${isUpcoming ? '#34d399' : '#a855f7'};font-size:${isUpcoming ? '1.15rem' : '1.45rem'};">${isUpcoming ? '100% Prepared' : (sheet.images || []).length + ' Captured'}</span>
          </div>
        </div>

        <!-- Test Photos Section -->
        ${sheet.images && sheet.images.length ? `
          <div class="section-wrap">
            <div class="section-head">
              <span>Test Photos (${sheet.images.length})</span>
              <span style="font-size:0.75rem;color:var(--text-dim);">Click to inspect evidence</span>
            </div>
            <div class="photos-grid">
              ${sheet.images.map(img => `
                <div class="photo-thumb-card" onclick="openModal('${img.file}', '${img.caption.replace(/'/g, "\\'")}')">
                  <div class="thumb-img-box">
                    <img src="${img.file}" alt="${img.caption}" loading="lazy">
                  </div>
                  <div class="photo-caption">${img.caption}</div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <!-- HTML Report Frame or Next Phase Briefing -->
        ${sheet.reportUrl ? `
          <div class="report-wrapper">
            <div class="report-bar">
              <span class="report-bar-title">📄 ${sheet.sheetName} — UAT HTML Report</span>
              <a href="${sheet.reportUrl}" target="_blank" class="open-ext-link">Open in New Tab ↗</a>
            </div>
            <iframe class="report-frame" src="${sheet.reportUrl}" title="${sheet.sheetName} Report"></iframe>
          </div>
        ` : `
          <div class="report-wrapper" style="display:flex;align-items:center;justify-content:center;padding:50px 24px;text-align:center;">
            <div style="max-width:560px;display:flex;flex-direction:column;align-items:center;gap:14px;">
              <div style="width:56px;height:56px;border-radius:14px;background:rgba(56,189,248,0.12);border:1px solid rgba(56,189,248,0.3);display:flex;align-items:center;justify-content:center;font-size:1.6rem;">🏛️</div>
              <h3 style="font-size:1.3rem;font-weight:800;color:#fff;">${sheet.sheetName} — Next Testing Phase</h3>
              <p style="font-size:0.88rem;color:var(--text-muted);line-height:1.6;">
                ${sheet.summary}
              </p>
              <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,0.04);border:1px solid var(--border-subtle);color:#cbd5e1;font-size:0.78rem;font-family:'JetBrains Mono',monospace;">
                <span>Target Endpoint:</span>
                <strong style="color:#38bdf8;">${sheet.targetRoute}</strong>
              </div>
              <p style="font-size:0.75rem;color:var(--text-dim);margin-top:6px;">
                Verified Next.js paperless portal architecture. Detailed UAT execution and test evidence capture will commence next.
              </p>
            </div>
          </div>
        `}
      `;
    }

    function openModal(src, caption) {
      document.getElementById('modalImg').src = src;
      document.getElementById('modalCaption').innerText = caption || '';
      document.getElementById('imageModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('imageModal').classList.remove('active');
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });

    window.onload = init;
  </script>
