<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CICOD User Acceptance Testing</title>
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Modular Stylesheet -->
  <link rel="stylesheet" href="assets/css/portal.css">
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand-box">
      <button class="sidebar-toggle-btn" id="sidebarToggle" onclick="toggleSidebar()" title="Toggle Sidebar (Ctrl+B)" aria-label="Toggle Sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>
      <div class="brand-icon">✓</div>
      <div class="brand-title">
        <h1>CICOD USER ACCEPTANCE TESTING</h1>
        <p>UAT VERIFICATION &amp; TEST SUITE REPORTS</p>
      </div>
    </div>
    <div class="status-badge-live">
      <span class="dot"></span>
      <span>12 SHEETS AUDITED</span>
    </div>
  </header>

  <!-- Main Application Layout -->
  <div class="layout-container">

    <!-- Modular Sidebar with Collapsible Groups -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>Modules &amp; Sheets</span>
        <button class="sidebar-collapse-btn" onclick="toggleSidebar()" title="Collapse Sidebar (Ctrl+B)" aria-label="Collapse Sidebar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="11 17 6 12 11 7"></polyline>
            <polyline points="18 17 13 12 18 7"></polyline>
          </svg>
        </button>
      </div>
      <div class="sidebar-list" id="sidebarList">
        <!-- Rendered dynamically by assets/js/portal.js -->
      </div>
    </aside>

    <!-- Main Dynamic View Area -->
    <main class="main-view" id="mainView">
      <!-- Rendered dynamically by assets/js/portal.js -->
    </main>

  </div>

  <!-- Modal Viewer for Test Photo Evidence -->
  <div class="modal-overlay" id="imageModal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()" title="Close Viewer">&times;</button>
      <div class="modal-img-wrap">
        <img id="modalImg" src="" alt="Test Photo">
      </div>
      <div class="modal-caption" id="modalCaption"></div>
    </div>
  </div>

  <!-- Modular Scripts -->
  <script src="assets/js/modules-data.js"></script>
  <script src="assets/js/portal.js"></script>
</body>
</html>
